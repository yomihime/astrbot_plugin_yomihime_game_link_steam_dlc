[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["worktrees", ".work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["worktrees", ".work", "dist"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["worktrees/", ".work/"]
