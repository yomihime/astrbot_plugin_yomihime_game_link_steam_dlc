name: Verify Steam DLC alpha

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      YGL_CORE_ROOT: .ci-core
      CS2_GATEWAY_FIXTURE: .local-dev/ci/cs2-gateway-fixture.json
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: yomihime/astrbot_plugin_yomihime_game_link
          ref: 56ae6e31c90ed09169522885a369f29a2f3ff181
          path: .ci-core
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        if: matrix.python == '3.13'
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned validation tools
        run: python -m pip install setuptools==80.9.0 wheel==0.45.1 ruff==0.12.0 mypy==1.17.1 Pillow==12.3.0
      - name: Install canonical SDK wheel from reviewed Core source
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          echo '/.ci-core/' >> .git/info/exclude
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir .ci-core/wheelhouse ./.ci-core
          python -m pip install --no-deps .ci-core/wheelhouse/yomihime_game_link_sdk-0.1.0a24-py3-none-any.whl
          python -c "import yomihime_game_link_sdk as s; assert s.__version__ == '0.1.0a24'; print(s.__file__)"
      - name: Verify offline behavior and boundaries
        run: |
          python -m unittest discover -s tests -v
          ruff check main.py packages tests scripts
          ruff format --check main.py packages tests scripts
          mypy packages/steam_dlc
      - name: Verify page lifetime and serialized Core results
        if: matrix.python == '3.13'
        run: |
          npm ci --ignore-scripts
          npm ci --prefix .ci-core/pages/frontend --ignore-scripts
          npm run test:pages
          node scripts/build_pages.mjs --core-root=.ci-core --check
          python scripts/sync_page_resources.py --check
      - name: Build and inspect installable plugin ZIP
        run: python scripts/build_release.py
