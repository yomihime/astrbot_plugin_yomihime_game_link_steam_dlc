name: Verify Steam DLC alpha

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      YGL_CORE_ROOT: .ci-core
      CS2_GATEWAY_FIXTURE: .local-dev/ci/cs2-gateway-fixture.json
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: yomihime/astrbot_plugin_yomihime_game_link
          ref: 61558fbba49d7a494fe8cc431279f51a4dda2f5a
          path: .ci-core
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        if: matrix.python == '3.13'
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned validation tools
        run: python -m pip install ruff==0.12.0 mypy==1.17.1 Pillow==12.3.0 "cryptography>=46.0.3"
      - name: Verify offline behavior and boundaries
        run: |
          echo '/.ci-core/' >> .git/info/exclude
          python - <<'PY'
          import runpy
          import unittest

          runpy.run_path("tests/conftest.py")
          unittest.main(module=None, argv=["unittest", "discover", "-s", "tests", "-v"])
          PY
          ruff check main.py packages tests scripts
          ruff format --check main.py packages tests scripts
          mypy packages/steam_dlc
      - name: Verify page lifetime and serialized Core results
        if: matrix.python == '3.13'
        run: |
          npm ci --ignore-scripts
          npm ci --prefix .ci-core/pages/frontend --ignore-scripts
          npm run test:pages
          node scripts/build_pages.mjs --core-root=.ci-core --check
          python scripts/sync_page_resources.py --check


  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.9"
      - name: Build ordinary AstrBot plugin ZIP
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: complete-dlc-candidate
          path: |
            dist/*.zip
            dist/SHA256SUMS
